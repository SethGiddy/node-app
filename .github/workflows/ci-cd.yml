name: CI-CD Pipeline

on:
  push:
    branches: [main]

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies & run tests (CI)
        run: |
          npm ci
          npm test

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }}

      - name: Configure Kubernetes access
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig

      - name: Deploy to Kubernetes (CD)
        run: |
          kubectl --kubeconfig=kubeconfig apply -f k8s/
          kubectl --kubeconfig=kubeconfig set image deployment/node-app \
            node-app=${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }}
          kubectl --kubeconfig=kubeconfig rollout status deployment/node-app